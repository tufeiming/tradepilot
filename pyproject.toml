[project]
name = "tradepilot"
version = "0.1.0"
description = "Headless VeighNa signal monitor for Chinese equities and ETFs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas==2.2.3",
    "requests>=2.32,<3",
    "vnpy==4.4.0",
    "vnpy_ctabacktester==1.3.0",
    "vnpy_ctastrategy==1.4.1",
    "vnpy_sqlite==1.1.3",
]

[project.scripts]
tradepilot = "tradepilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires live external services",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
