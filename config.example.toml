[monitor]
symbols = ["515080.SSE"]
poll_interval_seconds = 3.0
stale_after_seconds = 30.0
minimum_history_bars = 100

[strategy]
fast_window = 10
slow_window = 20

[feishu]
enabled = true
# webhook_url = "https://open.feishu.cn/open-apis/bot/v2/hook/..."

# The environment variable overrides webhook_url when both are set:
# TRADEPILOT_FEISHU_WEBHOOK_URL=https://open.feishu.cn/open-apis/bot/v2/hook/...
# Keep the optional signing secret in an environment variable:
# TRADEPILOT_FEISHU_SECRET=optional-signature-secret
